name: Build aarch64-host SDK image

# Single-build dev workflow: dispatches one image for one version/target,
# tagged with the official openwrt/sdk naming (the arch alias is computed
# from the OpenWrt tree via scripts/generate-matrix.sh):
#   ghcr.io/<owner>/openwrt-sdk-arm64:<target>-<subtarget>-<version>
#   ghcr.io/<owner>/openwrt-sdk-arm64:<arch>-<version>   (first row per arch)
#   ghcr.io/<owner>/openwrt-sdk-arm64:<version>          (convenience alias)
#
# For the full versions x targets matrix use release.yml.
#
# NOTE: `ubuntu-24.04-arm` is the ARM64 hosted runner label (free for public
# repositories). If it is unavailable on your plan, replace it with a
# self-hosted arm64 runner tag.

on:
  workflow_dispatch:
    inputs:
      version:
        description: OpenWrt release to build the SDK from (25.12.5, 22.03.7)
        required: false
        default: '25.12.5'
      target:
        description: SDK target, slash form (x86/64, armsr/armv8, ...)
        required: false
        default: 'x86/64'

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute the arch label from the OpenWrt tree
        id: matrix
        run: |
          command -v make >/dev/null || {
            sudo apt-get update -qq && sudo apt-get install -y -qq make
          }
          ./scripts/generate-matrix.sh "${{ inputs.version }}" "${{ inputs.target }}" \
            > matrix.json
          echo "arch_alias=$(python3 -c \
            'import json; print(json.load(open("matrix.json"))["include"][0]["arch_alias"])')" \
            >> "$GITHUB_OUTPUT"

      - name: Build and push the SDK image
        shell: bash
        run: |
          # Transient registry failures (BuildKit "unknown blob" at the push
          # stage) are retried; the buildx layer cache makes the retry cheap.
          set -o pipefail
          for attempt in 1 2 3; do
            if ./build.sh \
                --version "${{ inputs.version }}" \
                --target "${{ inputs.target }}" \
                --arch-label "${{ steps.matrix.outputs.arch_alias }}" \
                --push "ghcr.io/${{ github.repository_owner }}/openwrt-sdk-arm64" \
                2>&1 | tee /tmp/build.log; then
              exit 0
            fi
            if ! grep -q "unknown blob" /tmp/build.log; then
              echo "::error::build failed (non-transient error)"
              exit 1
            fi
            echo "::warning::transient registry error, retrying (attempt $attempt/3)"
            sleep 10
          done
          echo "::error::still failing after 3 attempts"
          exit 1
